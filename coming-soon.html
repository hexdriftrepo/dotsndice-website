<!DOCTYPE html>
<html lang="en">

<head>

    <!-- metas -->
    <meta charset="utf-8">
    <meta name="author" content="Website Design Templates">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="keywords" content="Project Consulting & Digital Agency HTML Template">
    <meta name="description" content="Leading Software, Website & App Development Company | SLBB">

    <!-- title  -->
    <title>Leading Software, Website & App Development Company | SLBB</title>

    <!-- favicon -->
    <link rel="shortcut icon" href="img/logo-small.webp">
    <link rel="apple-touch-icon" href="img/logos/apple-touch-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="72x72" href="img/logos/apple-touch-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="114x114" href="img/logos/apple-touch-icon-114x114.png">

    <!-- plugins -->
    <link rel="stylesheet" href="css/plugins.css">

    <!-- search css -->
    <link rel="stylesheet" href="search/search.css">

    <!-- quform css -->
    <link rel="stylesheet" href="quform/css/base.css">

    <!-- template core css -->
    <link href="css/styles.css" rel="stylesheet">

    <!-- custom css -->
    <link href="css/custom.css" rel="stylesheet">

</head>

<body>

    <!-- PAGE LOADING
    ================================================== -->
    <div id="preloader"></div>

    <!-- MAIN WRAPPER
    ================================================== -->
    <div class="main-wrapper">

        <!-- COMING-SOON PAGE
        ================================================== -->
        <section class="p-0 bg-secondary countdown-box">
            <div class="container-fluid d-flex flex-column position-relative z-index-9 px-md-6 px-lg-8 px-xxl-24">
                <div class="row align-items-center min-vh-100">
                    <div class="col-md-12">
                        <div class="my-1-6">
                            <ul class="countdown mb-1-9 mb-md-8 mb-lg-14 mb-xxl-20 p-0 wow fadeInUp" data-wow-delay="200ms">
                                <!-- weeks -->
                                <li class="text-white">
                                    <p class="timeRefWeeks">weeks</p>
                                    <span class="weeks">00</span>
                                </li>
                                <!-- end weeks -->
                                <!-- days -->
                                <li class="text-white">
                                    <p class="timeRefDays">days</p>
                                    <span class="days">00</span>
                                </li>
                                <!-- end days -->
                                <!-- hours -->
                                <li class="text-white">
                                    <p class="timeRefHours">hours</p>
                                    <span class="hours">00</span>
                                </li>
                                <!-- end hours -->
                                <!-- minutes -->
                                <li class="text-white">
                                    <p class="timeRefMinutes">minutes</p>
                                    <span class="minutes">00</span>
                                </li>
                                <!-- end minutes -->
                                <!-- seconds -->
                                <li class="text-white">
                                    <p class="timeRefSeconds">seconds</p>
                                    <span class="seconds">00</span>
                                </li>
                                <!-- end seconds -->
                            </ul>
                            <h2 class="text-white lh-1 font-weight-700 mb-1-9 mb-sm-2-9 wow fadeInUp" data-wow-delay="200ms">We are coming soon...</h2>
                            <ul class="list-unstyled mb-0 social-icon-style1">
                                <li><a href="#"><i class="fab fa-facebook-f"></i></a></li>
                                <li><a href="#"><i class="fa-brands fa-x-twitter"></i></a></li>
                                <li><a href="#"><i class="fab fa-instagram"></i></a></li>
                                <li><a href="#"><i class="fab fa-linkedin-in"></i></a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <!-- cursor helper -->
    <div class="cursor-helper">
        <div class="cursor-helper-outer"></div>
        <div class="cursor-helper-inner"></div>
    </div>

    <!-- SCROLL TO TOP
    ================================================== -->
    <div class="scroll-bar d-none d-xl-block">
        <a href="#" class="scroll-to-top" aria-label="scroll">
            <span class="scroll-text">Scroll</span><span class="scroll-ver-line"><span class="scroll-indicate"></span></span>
        </a>
    </div>

    <!-- all js include start -->

    <!-- jquery -->
    <script src="js/jquery.min.js"></script>

    <!-- popper js -->
    <script src="js/popper.min.js"></script>

    <!-- bootstrap -->
    <script src="js/bootstrap.min.js"></script>

    <!-- navigation -->
    <script src="js/nav-menu.js"></script>

    <!-- search -->
    <script src="search/search.js"></script>

    <!-- tab -->
    <script src="js/easy.responsive.tabs.js"></script>

    <!-- owl carousel -->
    <script src="js/owl.carousel.js"></script>

    <!-- animated headline -->
    <script src="js/animated-headline.js"></script>

    <!-- jarallax -->
    <script src="js/jarallax.min.js"></script>

    <!-- jarallax video -->
    <script src="js/jarallax-video.js"></script>

    <!-- stellar js -->
    <script src="js/jquery.stellar.min.js"></script>

    <!-- waypoints js -->
    <script src="js/waypoints.min.js"></script>

    <!-- odometer js -->
    <script src="js/odometer.min.js"></script>

    <!-- countdown js -->
    <script src="js/countdown.js"></script>

    <!-- jquery.magnific-popup js -->
    <script src="js/jquery.magnific-popup.min.js"></script>

    <!-- skrollr js -->
    <script src="js/skrollr.min.js"></script>

    <!-- wow js -->
    <script src="js/wow.js"></script>

    <!-- gsap js -->
    <script src="js/gsap.js"></script>

    <!-- scrolltrigger js -->
    <script src="js/scrolltrigger.js"></script>    

    <!-- smoothscroll js -->
    <script src="js/smoothscroll.js"></script>

    <!-- lightgallery js -->
    <script src="js/lightgallery-all.js"></script>

    <!-- mousewheel js -->
    <script src="js/jquery.mousewheel.min.js"></script>

    <!-- template core scripts -->
    <script src="js/main.js"></script>

    <!-- quform plugins js -->
    <script src="quform/js/plugins.js"></script>

    <!-- quform scripts js -->
    <script src="quform/js/scripts.js"></script>

    <!-- all js include end -->

</body>

</html>
